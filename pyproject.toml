[project]
name = "phonetic"
version = "1.0.1"
description = "Hotkey-based speech-to-text via multimodal LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sounddevice",
    "soundfile",
    "numpy",
    "pynput",
    "pyperclip; sys_platform != 'linux'",
    "python-dotenv",
    "httpx",
    "pystray",
    "Pillow",
    "customtkinter",
    "packaging",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
    "quickmachotkey; sys_platform == 'darwin'",
]

[project.optional-dependencies]
build = [
    "pyinstaller",
]

[project.scripts]
phonetic = "phonetic.__main__:main"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["phonetic*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
