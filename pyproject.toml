[project]
name = "phonetic"
version = "0.1.0"
description = "Hotkey-based speech-to-text via multimodal LLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sounddevice",
    "soundfile",
    "numpy",
    "pynput; sys_platform != 'linux'",
    "python-xlib; sys_platform == 'linux'",
    "pyperclip; sys_platform != 'linux'",
    "python-dotenv",
    "httpx",
]

[project.scripts]
phonetic = "main:main"
